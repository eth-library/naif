name: Greetings

# Use the base repository token for fork PRs; this workflow never checks out PR code.
on: [pull_request_target, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Hi there! Thanks for opening your first issue."
          pr_message: "Hi there! Thanks for opening your first pull request."
